<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>OT Loaner Register</title>
<style>
:root{--bg:#0b1220;--panel:#1b2638ee;--line:#334155;--text:#f8fafc;--muted:#94a3b8;--cyan:#22d3ee;--green:#22c55e;--yellow:#fbbf24;--red:#ef4444}*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 20% 0,#22314b 0,#0b1220 48%);color:var(--text)}button,input{font:inherit}.shell{max-width:1180px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#0891b2,#2563eb);display:grid;place-items:center;font-weight:900}.top h1{font-size:23px;margin:0}.sub{font-size:12px;color:var(--muted)}.install{display:none;border:1px solid #2c4b63;background:#102238;color:#dff7ff;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.layout{display:grid;grid-template-columns:310px 1fr;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 18px 45px #0005;backdrop-filter:blur(12px)}.loan-card{background:#081223;border:1px solid #164e63;color:var(--cyan);padding:15px 17px;border-radius:15px;font-size:26px;font-weight:900;overflow-wrap:anywhere}.small-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}.status-list{display:grid;gap:9px;margin-top:16px}.status-btn{display:flex;align-items:center;justify-content:space-between;border-radius:13px;padding:12px;border:1px solid transparent;background:#0f172a;color:var(--text);cursor:pointer;font-weight:800}.status-btn.active{border-color:#fff}.status-btn[data-status="Pending to Check"]{color:#fde68a}.status-btn[data-status="Checked"]{color:#bbf7d0}.status-btn[data-status="Returned"]{color:#fecaca}.dot{width:10px;height:10px;border-radius:50%}.pending-dot{background:var(--yellow)}.checked-dot{background:var(--green)}.returned-dot{background:var(--red)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.stat{background:#0f172a;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.stat strong{font-size:19px;display:block}.stat span{font-size:10px;color:var(--muted)}.toolbar{display:grid;gap:8px;margin-top:16px}.secondary{border:1px solid var(--line);background:#26364b;color:#fff;padding:11px;border-radius:11px;font-weight:800;cursor:pointer}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.section-head h2{margin:0;font-size:20px}.connection{font-size:11px;color:#a7f3d0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;color:#dbe5f1;font-size:13px;font-weight:800;margin-bottom:6px}.field input{width:100%;height:46px;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:#0f172a;color:#fff;outline:none}.field input:focus{border-color:#22d3ee;box-shadow:0 0 0 3px #22d3ee18}.full{grid-column:1/-1}.save{width:100%;margin-top:16px;height:50px;border:0;border-radius:14px;background:linear-gradient(90deg,#16a34a,#22c55e);color:white;font-weight:900;cursor:pointer}.toast{display:none;margin-top:10px;padding:11px 13px;border-radius:11px;background:#14532d;color:#dcfce7}.foot{font-size:11px;color:#64748b;text-align:center;margin-top:14px}.offline{color:#fde68a}.error{border-color:#fb7185!important}@media(max-width:780px){.shell{padding:14px}.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start}.panel{border-radius:20px}.status-list{grid-template-columns:1fr 1fr 1fr}.status-btn{font-size:11px;padding:10px 8px}.status-btn span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{margin-top:10px}}
</style></head><body><main class="shell"><div class="top"><div class="brand"><div class="logo">BME</div><div><h1>OT Loan Equipment Register</h1><div class="sub">Installable offline PWA • V2.0 based on V1.6</div></div></div><button id="installBtn" class="install">Install App</button></div><div class="layout"><aside class="panel"><div class="small-title">Current loaner</div><div class="loan-card" id="loanDisplay"># OT_Loaner01</div><div class="status-list"><button class="status-btn active" data-status="Pending to Check"><span>Pending to Check</span><span class="dot pending-dot"></span></button><button class="status-btn" data-status="Checked"><span>Checked</span><span class="dot checked-dot"></span></button><button class="status-btn" data-status="Returned"><span>Returned</span><span class="dot returned-dot"></span></button></div><div class="stats"><div class="stat"><strong id="pendingCount">0</strong><span>Pending</span></div><div class="stat"><strong id="checkedCount">0</strong><span>Checked</span></div><div class="stat"><strong id="returnedCount">0</strong><span>Returned</span></div></div><div class="toolbar"><button class="secondary" id="exportBtn">Export CSV</button><button class="secondary" id="backupBtn">Export Backup</button></div></aside><section class="panel"><div class="section-head"><h2>Loaner Information</h2><span id="networkState" class="connection">Online</span></div><form id="form" novalidate><div class="grid"><div class="field"><label for="supplier">Supplier *</label><input id="supplier" required autocomplete="organization"></div><div class="field"><label for="model">Model *</label><input id="model" required></div><div class="field"><label for="serial">Serial Number *</label><input id="serial" required></div><div class="field"><label for="testDate">Test Date *</label><input id="testDate" type="date" required></div><div class="field full"><label for="frequency">Test Frequency *</label><input id="frequency" required placeholder="e.g. Every 6 months"></div></div><button class="save" type="submit">Save Loaner Record</button><div id="toast" class="toast">✓ Record saved on this device.</div></form></section></div><div class="foot">Data is stored locally on this device until a central sync endpoint is added.</div></main>
<script src="app.js" defer></script></body></html>
